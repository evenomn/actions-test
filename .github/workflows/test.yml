name: tests

on:
  push:
    paths: ['monitor.py', 'vulnmon/**', 'tests/**', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: pytest -q
