# 漏洞监控配置。修改后无需改代码,GitHub Actions 下次运行即生效。

[cve]
# 基础 CVSS 门槛:低于该分数的漏洞不推送(KEV 在野利用漏洞不受此限制,必推)
cvss_threshold = 7.0

# 直推门槛:CVSS >= 该值即使没有 PoC/其他信号也够格入选,
# 但最终是否推送由「价值排序 + 每日上限 + 同厂商限量」决定,不再见高分就全推
direct_push_threshold = 9.0

# EPSS 强信号阈值:预测未来 30 天被利用概率 >= 该值视为强信号
epss_threshold = 0.10

# 回看窗口(小时)。NVD 数据入库有滞后,48h + 去重可兜底,不建议低于 24
lookback_hours = 48

# 每日最多推送条数(硬上限),按价值排序取头部。想多看点就调大
max_push = 15

# 同一厂商/生态每天最多推几条,防止 Cisco/WordPress 插件这类一天灌十几条的刷屏。
# 注意:被截掉的漏洞次日会重新参选,不会丢(v2 行为)
max_per_vendor = 3

# 关键词关注列表:命中任意关键词提升排序优先级。
# 注意:像 windows / linux kernel 这类极宽的词命中量巨大
keywords = [
  "nginx", "openssh", "openssl", "exchange",
  "spring", "tomcat", "vmware", "jenkins", "gitlab",
]

# 垃圾过滤:标题/描述/组件命中这些词的直接丢弃
ignore_keywords = ["wordpress plugin"]

# WordPress 插件灌水识别:NVD 描述带「plugin for WordPress」句式或 CPE 厂商为
# <slug>_project 的插件漏洞直接不推(KEV 在野利用除外)。每天几十条 9.8 分插件洞
# 的重灾区,建议保持开启;想看就把这里改成 false
ignore_wordpress_plugins = true

# 暴露面加权:命中这些组件类别的漏洞(见 vulnmon/components.py 的分类表)
# 在价值排序中 +150。实战里边界设备/中间件/CMS/OA 最常见暴露公网
focus_categories = [
  "边界设备/VPN", "Web中间件", "CMS", "邮件系统",
  "OA/协同办公", "开发运维/CI", "视频监控", "安全设备",
]

# AI 分析预算:价值排序前 N 条送 LLM 做逐条分析(优先级/复现价值/影响面),
# 分析结果反过来参与最终入选排序。配了 LLM_API_KEY 才生效
ai_analyze_limit = 30

# 变更检测:已推送过的漏洞若被 NVD 升分(±0.7 以上)或新增公开 PoC 引用,
# 次日日报会重推一条「📊 状态变化」。微调不刷屏
track_changes = true

# 即时告警模式(--mode events,每 4h):回看窗口与单次最多条数。
# 只推强信号:KEV 在野利用 / 有PoC / P0 / 状态变化
events_lookback_hours = 5
events_max = 3

[source]
# GitHub Security Advisories(仅 GitHub 人工审核的公告,自带包生态/影响版本/修复版本)
ghsa = true

# PoC 源码核验:对入选漏洞的 PoC 仓库查根目录文件,区分「真有 exploit 代码」
# 和「只有 README 的骗 star 占位仓库」。标签会带在 PoC 链接上([源码✅]/[仅README])
verify_poc_source = true

# RSS/Atom 资讯源(安全媒体、厂商博客、公众号转 RSS 如 wewe-rss)。
# 进日报尾部「📡 资讯」小节;标题带 CVE 号的会挂到对应漏洞条目上。留空关闭
feeds = []

# Exploit-DB 公开 PoC 映射(CVE -> EDB 链接)
exploitdb = true

# nomi-sec/PoC-in-GitHub 数据集:社区按日维护的 CVE -> GitHub PoC 仓库映射,
# raw 直拉、带 star 数,比 GitHub 搜索 API 稳定(推荐保持开启)
poc_dataset = true

# GitHub 搜索兜底:对数据集没命中的入选条目再搜一次(小预算,防限流)
search_github_poc = true

# projectdiscovery/nuclei-templates:该 CVE 是否已有公开检测模板(武器化信号)
nuclei_templates = true

[notify]
# 推送渠道,可多选: dingtalk / feishu / wecom / telegram / slack。
# 留空 [] = 按已配置的环境变量自动探测(推荐)
channels = []

# 无符合条件漏洞的当天是否也发一条「一切正常」的心跳消息(推荐开,用于确认管道存活)
notify_empty = true

# 无 LLM 时是否用 Google 免费接口机翻中文摘要(失败自动降级英文;本地被墙属正常,CI 可用)
translate = true

[dingtalk]
# 何时 @所有人: "never" | "critical"(仅当天有🔴严重漏洞时) | "always"
at_all = "critical"

[report]
# 机器可读输出:data/feed.json(结构化,供看板/程序消费)
feed_json = true

# data/feed.xml(RSS 2.0,可用 RSS 阅读器订阅)
rss = true

# 高价值可复现漏洞库:data/repro.md + data/repro.json(固定路径,滚动维护)。
# 只收录 AI 判定「强烈推荐/值得」复现的;无 AI 时要求有 kev/PoC/nuclei 证据。
# 内网拉取: git pull 读文件,或 curl raw.githubusercontent.com/<repo>/main/data/repro.json
repro = true

# 可复现库滚动保留天数(超过未再出现的条目淘汰)
repro_retention_days = 21

[state]
# 已见 CVE 记录的保留天数(防 state.json 无限增长)
retention_days = 30

# ---------------------------------------------------------------- 环境变量速查
# (在仓库 Settings -> Secrets and variables -> Actions 里配置,全部可选按需)
#
# 通用:
#   NVD_API_KEY          NVD 限速提升(免费申请)
#   LLM_API_KEY          启用 LLM 中文标题+摘要(OpenAI 兼容)
#   LLM_BASE_URL/LLM_MODEL  如 https://api.deepseek.com / deepseek-chat
#
# 渠道(配置任意一个即启用该渠道;channels 留空时自动探测):
#   DINGTALK_WEBHOOK / DINGTALK_SECRET
#   FEISHU_WEBHOOK                 飞书自定义机器人
#   WECOM_WEBHOOK                  企业微信群机器人
#   TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
#   SLACK_WEBHOOK                  Incoming Webhook
